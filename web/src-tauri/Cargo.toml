[package]
name = "kiuq-website-system"
version = "0.1.0"
description = "KiuQ Website System — macOS desktop wrapper"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kiuq_website_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
